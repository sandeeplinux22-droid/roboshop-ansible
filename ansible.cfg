[defaults]
# Path to your inventory file or directory
inventory = ./hosts              

# Remote user Ansible will use to log into managed nodes
remote_user = ubuntu             

# Number of parallel processes/connections to use
forks = 5                        

# Skips the interactive "Are you sure you want to continue connecting?" SSH prompt
host_key_checking = False        

# Format stdout output as clean, readable YAML instead of JSON
stdout_callback = yaml           

[privilege_escalation]
# Automatically elevate privileges (run as sudo)
become = True                    

# Method used for privilege escalation
become_method = sudo             

# The user you become after escalation
become_user = root               

# Prompt for a password when running playbooks (True/False)
become_ask_pass = False          

[ssh_connection]
# Reduces SSH operations by running multiple instructions over a single multiplexed connection
pipelining = True                
