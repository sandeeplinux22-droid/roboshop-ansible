- name: configure RabbitMQ
  hosts: rabbitmq
  # connection: rabbitmq
  become: yes
  tasks:
  - name: copy the file
    copy: 
     src: rabbitmq.repo 
     dest: /etc/yum.repos.d/rabbitmq.repo
  - name: install rabbitmq server
    dnf:
      name: 
      - erlang
      - rabbitmq-server
      state: present
  - name: enable  the service
    service:
     name: rabbitmq-server
     enabled: yes
     state: present
  - name: start the service
    service:
     name:  rabbitmq-server
     enabled: yes
     state: present
  - name: set the permission
    command: rabbitmqctl set_permissions -p / roboshop ".*" ".*" ".*"