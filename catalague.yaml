- name: configure nodejs
  hosts: catalague
  become: yes
  tasks:
   - name: enable the nodejs
     command: dnf module enable nodejs:24 -y
   - name: install nodejs
     package:
      name: nodejs
      state: present
   - name: create application user
     user: 
      name: roboshop
      shell: /sbin/nologin
      comment: "roboshop system user" 
      
   - name: create directory 
     file: 
       path : /app
       state: directory 
   - name: remove catalogue.zip
     file:
      path: /tmp/catalogue.zip
      state: absent
   - name: download catalogue application
     get_url:
      url: https://raw.githubusercontent.com/daws-92s/roboshop-documentation/refs/heads/main/artifacts/catalogue-v4.zip
      dest: /tmp/catalogue.zip
   - name: unzip the file 
     unarchive:
       src: /tmp/catalogue.zip
       dest: /app
       remote_src: yes
   - name: install dependencies
     community.general.npm:
      path: /app 
   - name: start and enable catalogue
     service:
      name: catalogue
      state: started
      enabled: yes

   - name: restart catalogue
     service:
      name: catalogue
      state: restarted
      enabled: yes

