- name: configure mongodb
  hosts: mongodb
  become: yes
  tasks:
  - name: copy mongorepo
    copy:
      src: mongo.repo
      dest: /etc/yum.repos.d/mongo.repo
  - name: install the packages 
    package:
      name:  mongodb-org 
      state: present
  - name: enable mongod
    service:
     name: mongod
     state: started
     enable: yes
  - name: start mongod
    service:
     name: mongod
     state: present
     enable: yes 

  - name: allow remote connections  
    replace:
     path: /etc/mongod.conf
     regexp: '127.0.0.1'
     replace: '0.0.0.0'

    